<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0e0e12;overflow:hidden}svg{display:block;font-family:Inter,Arial,sans-serif}</style></head><body><svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg><script>
const svg=document.getElementById('s'),N='http://www.w3.org/2000/svg',C={bg:'#0e0e12',fg:'#f5f6f7',mut:'#9da6b5',green:'#63d297',orange:'#fa5d19',violet:'#8b5cf6',amber:'#f59e0b',panel:'#1d202b'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)},seg=(t,a,b)=>ease((t-a)/(b-a));
function add(tag,attrs={},value){let e=document.createElementNS(N,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(value!==undefined)e.textContent=value;svg.appendChild(e);return e}
function txt(x,y,v,size=48,color=C.fg,anchor='middle',weight='400',opacity=1){return add('text',{x,y,fill:color,'font-size':size,'text-anchor':anchor,'font-weight':weight,opacity},v)}
function rect(x,y,w,h,fill=C.panel,rx=18,stroke='none',sw=0,opacity=1){return add('rect',{x,y,width:w,height:h,rx,fill,stroke,'stroke-width':sw,opacity})}
function line(x1,y1,x2,y2,color=C.mut,sw=3,opacity=1){return add('line',{x1,y1,x2,y2,stroke:color,'stroke-width':sw,opacity})}
function circle(x,y,r,fill,opacity=1){return add('circle',{cx:x,cy:y,r,fill,opacity})}
function base(){rect(0,0,1920,1080,C.bg,0);txt(90,89,'CHAT SEEK',30,C.green,'start','700');line(90,116,1830,116,'#343844',2);}
function scene1(t){const p=seg(t,0,1.3);txt(960,280,'You remember the idea.',78,C.fg,'middle','700',p);txt(960,360,'Where was that conversation?',42,C.mut,'middle','400',seg(t,1,2));const labels=['fixing the router','a benchmark score','that strange error','the old design idea','JevBench','last week’s test'];for(let i=0;i<6;i++){let x=240+(i%3)*500,y=510+Math.floor(i/3)*170;let o=seg(t,1+i*.18,2+i*.18);rect(x,y,410,116,C.panel,15,'#444957',2,o);circle(x+44,y+57,16,[C.green,C.orange,C.violet][i%3],o);txt(x+80,y+70,labels[i],30,C.fg,'start','400',o)}}
function scene2(t){txt(960,244,'Three chat histories. One local index.',66,C.fg,'middle','700',seg(t,6,7));let names=['Claude Code','Codex','OpenCode'],colors=[C.orange,C.violet,C.green];for(let i=0;i<3;i++){let x=290+i*590,y=450;let p=seg(t,6.7+i*.3,8+i*.3);rect(x,y,460,136,C.panel,17,colors[i],3,p);txt(x+230,y+82,names[i],38,C.fg,'middle','600',p);let q=seg(t,8.5+i*.15,11);line(x+230,y+136,960,795,colors[i],4,q)}let p=seg(t,9.2,11.2);rect(760,795,400,125,'#173227',19,C.green,3,p);txt(960,875,'PRIVATE INDEX',36,C.green,'middle','700',p)}
function scene3(t){txt(960,240,'Describe what you remember',66,C.fg,'middle','700',seg(t,12,13));rect(225,350,1470,125,C.panel,18,C.green,3,seg(t,12.5,13.5));let q='Where did we implement JevBench scoring?';txt(270,430,q.slice(0,Math.max(0,Math.floor((t-13)*18))),44,C.fg,'start','400');let p=seg(t,15,18);for(let i=0;i<33;i++){let x=225+(i%11)*132,y=600+Math.floor(i/11)*95;let active=i===6||i===16||i===28;circle(x,y,active?16:11,active?C.green:'#4d5361',active?1:1-p*.84)}txt(960,965,'Fast search shortlists likely messages',38,C.mut,'middle','400',seg(t,15.5,17));}
function scene4(t){txt(960,228,'Laya judges each candidate locally',66,C.fg,'middle','700',seg(t,18,19));let names=['Passing mention','JevBench implementation','Unrelated result'],scores=[0.5,2.8,0.3];for(let i=0;i<3;i++){let y=365+i*170,p=seg(t,19+i*.3,20.5+i*.3);rect(300,y,1320,125,C.panel,16,'#444957',2,p);txt(342,y+77,names[i],34,C.fg,'start','500',p);rect(1060,y+46,425,32,'#313541',16,'none',0,p);rect(1060,y+46,425*(scores[i]/3)*seg(t,21,23.3),32,i===1?C.green:C.violet,16,'none',0,p);txt(1530,y+76,scores[i].toFixed(1)+' / 3',34,i===1?C.green:C.mut,'start','700',p)}txt(960,980,'The strongest match rises to the top',37,C.mut,'middle','400',seg(t,23,24.5))}
function scene5(t){txt(960,260,'Found it.',76,C.fg,'middle','700',seg(t,25,26));let p=seg(t,25.8,27.2);rect(410,355,1100,335,C.panel,24,C.green,3,p);txt(475,435,'Claude Code  ·  JevBench',37,C.green,'start','700',p);txt(475,510,'We implemented hard-tier tests and calibration scoring...',34,C.fg,'start','400',p);line(475,553,1445,553,'#505663',2,p);txt(475,612,'Read nearby messages in VS Code  →',34,C.fg,'start','600',p);txt(960,840,'No transcript uploaded.',39,C.green,'middle','500',seg(t,28,29.5))}
function scene6(t){let p=seg(t,30,31.4);circle(960,424,110,'#173a2b',p);add('circle',{cx:942,cy:405,r:39,fill:'none',stroke:C.green,'stroke-width':15,opacity:p});line(970,438,1035,505,C.green,17,p);txt(960,680,'Chat Seek',95,C.fg,'middle','700',p);txt(960,752,'Open source · Claude Code · Codex · OpenCode',38,C.mut,'middle','400',seg(t,31,32.5));txt(960,892,'github.com/fstandhartinger/chat-seek-vscode',35,C.green,'middle','500',seg(t,32,33.2))}
window.seekTo=t=>{svg.replaceChildren();base();if(t<6)scene1(t);else if(t<12)scene2(t);else if(t<18)scene3(t);else if(t<25)scene4(t);else if(t<30)scene5(t);else scene6(t)};window.__ready=true;window.seekTo(0);
</script></body></html>
