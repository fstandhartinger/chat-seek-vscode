<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How Chat Seek searches</title><style>html,body{margin:0;width:100%;height:100%;background:#0e0e12;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head><body><canvas id="stage" width="1280" height="720"></canvas><script>
const c=document.getElementById('stage'),g=c.getContext('2d');
const C={bg:'#0e0e12',panel:'#17191e',panel2:'#1d2027',text:'#f4f4f2',muted:'#a9afb9',line:'#454c55',green:'#63d297',orange:'#fa5d19',violet:'#8b5cf6',amber:'#f59e0b',blue:'#55a9e7'};
const bounds=[0,8,17,26,35,44,53,60];
window.CONFIG={total:60,bounds};window.__ready=true;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
function alpha(a,fn){g.save();g.globalAlpha*=clamp(a);fn();g.restore()}
function rr(x,y,w,h,r,fill,stroke,width=1){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke()}}
function line(x1,y1,x2,y2,color=C.line,width=2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=color;g.lineWidth=width;g.stroke()}
function circle(x,y,r,fill,glow=0){g.save();if(glow){g.shadowBlur=glow;g.shadowColor=fill}g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=fill;g.fill();g.restore()}
function txt(s,x,y,size=26,color=C.text,weight=500,maxWidth=1000,align='left'){g.save();g.fillStyle=color;g.textAlign=align;let n=size;do{g.font=`${weight} ${n}px Inter,Arial,sans-serif`;if(g.measureText(s).width<=maxWidth||n<=14)break;n--}while(true);g.fillText(s,x,y);g.restore()}
function label(s,x,y,color=C.muted){txt(s.toUpperCase(),x,y,17,color,700,1000)}
function arrow(x1,y1,x2,y2,color=C.green,p=1){g.save();g.globalAlpha*=p;line(x1,y1,x2,y2,color,3);const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-13*Math.cos(a-.5),y2-13*Math.sin(a-.5));g.lineTo(x2-13*Math.cos(a+.5),y2-13*Math.sin(a+.5));g.closePath();g.fillStyle=color;g.fill();g.restore()}
function glowBar(x,y,w,color,p=1){rr(x,y,w,8,4,'#272c34');rr(x,y,w*clamp(p),8,4,color)}
function header(t,mode){txt('CHAT SEEK',55,57,24,C.text,800,300);txt('HOW IT SEARCHES',55,88,15,C.muted,700,300);txt(mode.toUpperCase(),1218,60,17,C.green,700,300,'right');line(55,106,1225,106,C.line,1);glowBar(55,684,1170,C.green,t/60)}
function title(main,sub){txt(main,55,165,40,C.text,700,1170);txt(sub,55,200,21,C.muted,400,1170)}
function sourceBox(x,y,name,color,icon,p){alpha(p,()=>{rr(x,y,275,94,16,C.panel,color,2);circle(x+34,y+47,13,color,12);txt(name,x+61,y+53,23,C.text,650,190)})}
function chip(x,y,w,s,color=C.green){rr(x,y,w,39,10,C.panel2,color,1.5);txt(s,x+w/2,y+26,18,color,650,w-16,'center')}
function drawSource(t){const p=ease(t/2);title('Three histories, one local index','Claude Code, Codex, and OpenCode stay on your machine.');sourceBox(86,282,'Claude Code',C.orange,ease((t-.1)/.8));sourceBox(86,392,'Codex',C.blue,ease((t-.8)/.8));sourceBox(86,502,'OpenCode',C.violet,ease((t-1.5)/.8));alpha(p,()=>{rr(735,304,430,255,23,C.panel,C.green,2.5);txt('PRIVATE INDEX',950,362,27,C.green,800,340,'center');line(794,389,1106,389,C.line,1);txt('chat  •  date  •  path  •  text',950,445,25,C.text,500,380,'center');txt('saved for fast lookup',950,504,19,C.muted,400,350,'center')});for(let i=0;i<3;i++){const yy=329+i*110;arrow(375,yy,735,380+i*55,C.green,ease((t-2.4-i*.55)/.65));const progress=(t-3.2-i*.55)*.45;if(progress>0&&progress<1)circle(375+progress*360,yy+(380+i*55-yy)*progress,6,C.green,14)}}
function drawIndex(t){title('What gets indexed?','A compact lookup record for each supported chat message.');rr(100,250,760,318,22,C.panel,C.green,2);label('LOCAL RECORD',145,296,C.green);const fields=[['SOURCE','Claude Code'],['CHAT ID','session-…'],['DATE','recent activity'],['PATH','original transcript'],['TEXT','first 2,800 characters']];for(let i=0;i<fields.length;i++){const y=339+i*47;txt(fields[i][0],145,y,17,C.muted,700,180);txt(fields[i][1],325,y,21,C.text,550,480);if(i<fields.length-1)line(145,y+15,811,y+15,'#31363e',1)}const p=ease((t-3.3)/1.3);alpha(p,()=>{rr(910,295,260,190,18,C.panel2,C.violet,2);txt('UNCHANGED FILE?',1040,352,21,C.violet,750,225,'center');txt('Reuse cached entries',1040,402,19,C.text,500,230,'center');circle(1040,445,15,C.green,12);txt('✓',1040,451,21,C.bg,800,30,'center')});txt('Tool outputs are not in the normal-search index.',100,617,18,C.muted,400,1000)}
function drawWords(t){title('Normal search: fast shortlist','Find matching words in the private index.');rr(82,254,1116,83,17,C.panel,C.blue,2);txt('JevBench scoring',118,307,29,C.text,600,850);rr(1032,272,133,47,11,C.blue);txt('SEARCH',1098,303,18,C.bg,800,105,'center');const words=[['JevBench',C.violet],['scoring',C.amber]];words.forEach((w,i)=>alpha(ease((t-1.7-i*.45)/.7),()=>chip(370+i*230,377,200,w[0],w[1])));alpha(ease((t-3)/1),()=>{for(let i=0;i<5;i++){rr(170+i*145,481,120,77,12,C.panel2,i===1?C.green:C.line,2);txt(['1','2','3','4','…'][i],230+i*145,530,29,i===1?C.green:C.muted,700,80,'center')}txt('Top 80 message matches',640,610,24,C.green,650,600,'center')})}
function drawRerank(t){title('Normal search: Laya reranks','A few shortlisted messages become recognizable chat cards.');rr(78,286,430,280,21,C.panel,C.violet,2);label('KEYWORD SHORTLIST',110,330,C.violet);for(let i=0;i<4;i++){rr(113,354+i*47,346,34,8,C.panel2);txt(['JevBench score page','Benchmark calibration','Model routing notes','A related mention'][i],129,378+i*47,17,C.text,500,300)}arrow(539,421,681,421,C.green,ease((t-1.8)/.7));circle(770,421,83,C.green,25);txt('LAYA',770,431,27,C.bg,800,120,'center');arrow(862,421,1000,421,C.green,ease((t-2.7)/.7));alpha(ease((t-3.1)/.7),()=>{rr(997,307,210,228,18,C.panel,C.green,2);label('CHAT RESULT',1020,343,C.green);txt('JevBench',1020,390,23,C.text,700,170);txt('1 week ago',1020,424,17,C.muted,400,170);txt('Read excerpt',1020,466,17,C.green,600,170);txt('Resume chat',1020,498,17,C.green,600,170)});txt('Optional one-sentence summaries are cached separately.',88,627,19,C.muted,400,1060)}
function drawQuestion(t){title('A factual question uses original text','Quick likely-message pass first; the full scan follows.');rr(90,260,1100,80,16,C.panel,C.amber,2);txt('When did the demo launch?',130,311,28,C.text,600,970);const p=ease((t-1.5)/.8);alpha(p,()=>{rr(118,402,460,154,20,C.panel2,C.green,2);label('QUICK PASS',149,446,C.green);txt('Likely original messages',149,489,24,C.text,600,400);txt('Read directly from source files',149,523,18,C.muted,400,400)});alpha(ease((t-3.5)/.8),()=>{rr(704,402,460,154,20,C.panel2,C.violet,2);label('FULL PASS',735,446,C.violet);txt('Every transcript chunk',735,489,24,C.text,600,400);txt('Newest chats first',735,523,18,C.muted,400,400)});arrow(592,477,687,477,C.amber,ease((t-3)/.7));txt('The quick pass changes order, not coverage.',640,622,19,C.muted,400,800,'center')}
function drawChunks(t){title('Full scan: overlapping chunks','Laya checks each chunk against the question.');const start=90,baseY=296;for(let i=0;i<7;i++){const x=start+i*158;rr(x,baseY,190,120,15,C.panel,i===Math.min(6,Math.floor((t/8)*7))?C.green:C.line,2);txt('CHUNK '+String(i+1),x+18,baseY+42,19,i===Math.min(6,Math.floor((t/8)*7))?C.green:C.muted,750,155);line(x+18,baseY+67,x+160,baseY+67,C.line,1);line(x+18,baseY+86,x+134,baseY+86,C.line,1)}const k=Math.min(6,Math.floor((t/8)*7));circle(start+k*158+95,baseY+143,7,C.green,15);txt('slight overlap preserves context',640,512,23,C.text,550,600,'center');glowBar(215,552,850,C.violet,(t+1)/8);txt('Complete original text • no 2,800-character clipping',640,612,19,C.muted,400,900,'center')}
function drawAnswer(t){title('Answer + exact citation','The quote must occur in the original chunk.');alpha(ease(t/.8),()=>{rr(137,247,1006,336,23,C.panel,C.green,2);label('ANSWER',177,296,C.green);txt('The demo launched on 12 March.',177,349,30,C.text,700,900);line(177,374,1102,374,C.line,1);label('VERIFIED QUOTE',177,421,C.violet);rr(177,441,925,61,11,C.panel2);txt('“The demo launched on 12 March.”',201,482,23,C.text,500,860);chip(177,526,210,'Open full chunk',C.green);chip(406,526,187,'Resume chat',C.blue)});txt('Citations are checked against source text, not the index.',640,632,19,C.muted,400,940,'center')}
const scenes=[drawSource,drawIndex,drawWords,drawRerank,drawQuestion,drawChunks,drawAnswer];
window.seekTo=function(t){t=clamp(t,0,60);g.fillStyle=C.bg;g.fillRect(0,0,1280,720);const s=Math.min(6,bounds.findIndex((b,i)=>i<bounds.length-1&&t>=b&&t<bounds[i+1]));const idx=s<0?6:s;const local=t-bounds[idx];header(t,idx<2?'INDEXING':idx<4?'NORMAL SEARCH':'QUESTION SEARCH');g.save();const fadeIn=ease(local/.45),fadeOut=ease((bounds[idx+1]-t)/.45);g.globalAlpha=Math.min(fadeIn,fadeOut,1);scenes[idx](local);g.restore()};window.seekTo(0);
</script></body></html>
